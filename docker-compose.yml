services:
  bridge:
    build: .
    container_name: plane-github-bridge
    restart: unless-stopped
    # Host networking: the bridge reaches Plane at localhost:8090 and listens on
    # 127.0.0.1:8095, which only cloudflared on this machine can reach.
    network_mode: host
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bridge-data:/data

volumes:
  bridge-data:
