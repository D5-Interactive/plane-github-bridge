services:
  bridge:
    build: .
    container_name: plane-github-bridge
    restart: unless-stopped
    # Host networking: the bridge reaches Plane on localhost and listens on
    # 127.0.0.1:8095, so only a tunnel or reverse proxy on this machine can reach it.
    network_mode: host
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bridge-data:/data
      # Only for your own GitHub App (README step 5B):
      # - ./github-app.pem:/app/github-app.pem:ro

volumes:
  bridge-data:
