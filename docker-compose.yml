services:
  bridge:
    build: .
    container_name: plane-github-bridge
    restart: unless-stopped
    # Host networking: the bridge reaches Plane on localhost and listens on
    # 127.0.0.1:8095, so only a tunnel or reverse proxy on this machine can reach it.
    network_mode: host
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bridge-data:/data
      # Your own GitHub App's private key goes in ./secrets (README step 5B).
      # Empty or missing is fine for every other setup.
      - ./secrets:/app/secrets:ro

volumes:
  bridge-data:
