# Which Plane work items get a GitHub issue, and in which repo.
#
#   project: the Plane project identifier (the prefix in IDs like API-12)
#   module:  optional Plane module name. With it, only items in that module sync.
#            Without it, every item in the project syncs to that repo.
#   repo:    the GitHub repository, owner/name
#
# If an item matches both a module mapping and a project-wide mapping,
# the module mapping wins.

mappings:
  - project: API
    module: Auth
    repo: your-org/auth-service

  # Every work item in the WEB project goes to one repo:
  # - project: WEB
  #   repo: your-org/website
